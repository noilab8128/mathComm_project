[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olympiadai"
version = "0.1.0"
description = "OlympiadAI clean restart — Thinking Graph first"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.22,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/olympiadai"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
exclude = ["._*", "**/._*", ".__*", "**/.__*"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
